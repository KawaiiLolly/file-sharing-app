{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - File Share</title>
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>

<body>

    <div class="container">
        <div class="auth-left">

            <div class="auth-form-wrapper">
                <h1>Create an Account</h1>

                {% if messages %}
                <ul class="messages">
                    {% for message in messages %}
                    <li{% if message.tags %} class="{{ message.tags }}" {% endif %}>{{ message }}</li>
                        {% endfor %}
                </ul>
                {% endif %}

                <form method="post" action="{% url 'signup' %}">
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="id_name">Full Name</label>
                        <input type="text" name="name" id="id_name" required autofocus placeholder="John Doe">
                    </div>
                    <div class="form-group">
                        <label for="id_email">Email Address</label>
                        <input type="email" name="email" id="id_email" required placeholder="you@example.com">
                    </div>
                    <div class="form-group">
                        <label for="id_password">Password</label>
                        <input type="password" name="password" id="id_password" required placeholder="••••••••"
                            minlength="8">
                    </div>
                    <div class="form-group">
                        <label for="id_confirm_password">Confirm Password</label>
                        <input type="password" name="confirm_password" id="id_confirm_password" required
                            placeholder="••••••••" minlength="8">
                    </div>

                    <button type="submit" class="btn-primary">Sign Up</button>

                    <div class="auth-footer">
                        Already have an account? <a href="{% url 'login' %}">Log in</a>
                    </div>
                </form>

            </div>
        </div>

        <div class="auth-right">
            <div class="tech-gradient"></div>
            <div class="grid-overlay"></div>
        </div>
    </div>

</body>

</html>
