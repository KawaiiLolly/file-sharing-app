<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - File Sharing Control Plane</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background-color: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            margin-top: 0;
            color: #333;
            text-align: center;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #666;
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 1rem;
        }
        button:hover {
            background-color: #0056b3;
        }
        .error-message {
            color: #dc3545;
            margin-bottom: 1rem;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>

<div class="login-container">
    <h2>Control Plane Login</h2>
    
    {% if form.errors %}
        <div class="error-message">Your username and password didn't match. Please try again.</div>
    {% endif %}

    <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_username">Username</label>
            {{ form.username }}
        </div>
        <div class="form-group">
            <label for="id_password">Password</label>
            <div style="position: relative;">
                {{ form.password }}
                <button type="button" id="toggle-password" title="Hold to show password" style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: auto; padding: 4px; margin: 0; background: transparent; color: #666; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </button>
            </div>
        </div>
        <button type="submit">Log in</button>
        <input type="hidden" name="next" value="{{ next }}" />
    </form>
    
    <div style="margin-top: 15px; text-align: center; font-size: 0.9rem;">
        Don't have an account? <a href="{% url 'signup' %}" style="color: #007bff; text-decoration: none;">Sign up here</a>
    </div>
</div>

<script>
    const passwordInput = document.getElementById('id_password');
    const toggleButton = document.getElementById('toggle-password');
    
    // Hold effect (not toggle)
    toggleButton.addEventListener('mousedown', function(e) {
        e.preventDefault(); // Prevent focus loss
        passwordInput.type = 'text';
    });
    
    toggleButton.addEventListener('mouseup', function() {
        passwordInput.type = 'password';
    });
    
    toggleButton.addEventListener('mouseleave', function() {
        passwordInput.type = 'password';
    });
</script>
</body>
</html>
