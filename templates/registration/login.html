{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - File Share</title>
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>

<body>

    <div class="container">
        <div class="auth-left">

            <div class="auth-form-wrapper">
                <h1>Log In</h1>

                {% if form.errors %}
                <div class="error-message">Invalid email or password. Please try again.</div>
                {% endif %}

                <form method="post" action="{% url 'login' %}">
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="id_username">Email</label>
                        <input type="email" name="username" id="id_username" required autofocus
                            placeholder="Enter your email">
                    </div>
                    <div class="form-group">
                        <label for="id_password">Password</label>
                        <div class="password-container">
                            <input type="password" name="password" id="id_password" required placeholder="••••••••">
                            <button type="button" class="toggle-password" id="toggle-password"
                                title="Hold to show password">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary">Sign in</button>
                    <input type="hidden" name="next" value="{{ next|default:'/' }}" />

                    <div class="auth-footer">
                        Don't have an account? <a href="{% url 'signup' %}">Create one</a>
                    </div>
                </form>
            </div>
        </div>

        <div class="auth-right">
            <div class="tech-gradient"></div>
            <div class="grid-overlay"></div>
        </div>
    </div>

    <script src="{% static 'js/auth.js' %}"></script>
</body>

</html>
